about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  Computer Scientist from Peru, combining technical depth in AI and data science with a strong commitment to
  social impact. Currently pursuing a Master's in Social Policy at UNMSM, building on research with The World Bank
  on healthcare accessibility in developing countries. Background shaped by growing up in a rural Andean community
  and experience at unicorn tech companies and international organizations across Latin America and the United States.

  **Core Competencies:** <mark>Data Science & ML</mark>, <mark>Graph Theory & Geospatial Analysis</mark>,
  <mark>Data Architecture</mark>, <mark>Python</mark>, <mark>Big Data</mark>, and <mark>Cloud (Azure, GCP, AWS)</mark>


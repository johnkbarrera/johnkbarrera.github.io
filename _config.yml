        title: The World Bank
        link: worldbank.org
        sub_title: Data Scientist Consultant
        caption: January 2023 - December 2025
        quote: >
          Leveraging data science for development impact
        description: |
          Led research on healthcare accessibility in developing countries, building mathematical models using graph
          theory and machine learning to measure population risk and distance to health services.
          - Integrated large-scale geographic datasets with AI models and benchmarked results against methods used by
            the countries under study. Work covered multiple countries across different continents.
          - Research connected to master's thesis and resulted in a peer-reviewed publication.

          **Technologies:** Python, Machine Learning, Graph Theory, Geospatial Analysis, Big Data

      - layout: left
